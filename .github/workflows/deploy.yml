name: Cloud Assembly & Deploy to Aliyun

# 触发器：当你向 my-blog 的 main 分支推送代码时执行
on:
  push:
分支:
      - main
      - master # 兼容部分默认分支叫 master 的情况
  workflow_dispatch: # 开启网页端一键手动触发功能

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # ==========================================
      # 阶段一：获取主引擎 (VitePress 配置层)
      # ==========================================
      - name: 1. Checkout Main Engine Repo
        uses: actions/checkout@v4

      # ==========================================
      # 阶段二：微服务模块拉取 (替换本地的软链接)
      # ==========================================
      - name: 2.1 Checkout Tech Notes
        uses: actions/checkout@v4
        with:
          repository: G1234-cod/tech-note
          path: docs/tech-note

      - name: 2.2 Checkout AI Journey
        uses: actions/checkout@v4
        with:
          repository: G1234-cod/AI-Application-Learning-Journey
          path: docs/ai-journey

      - name: 2.3 Checkout LeetCode Solutions
        uses: actions/checkout@v4
        with:
          repository: G1234-cod/leetcode-solutions
          path: docs/leetcode

      - name: 2.4 Checkout Env Setup
        uses: actions/checkout@v4
        with:
          repository: G1234-cod/env-setup
          path: docs/env-setup
          
      - name: 2.5 Checkout Reading Notes
        uses: actions/checkout@v4
        with:
          repository: G1234-cod/Reading-and-Comprehension
          path: docs/reading # 必须映射为 config.mjs 里写的 /reading/ 路径
      # ==========================================
      # 阶段三：特殊复杂仓库拼装 (简历原生 HTML 与 项目文档)
      # ==========================================
      - name: 3.1 Checkout Resume Repo to Temp Folder
        uses: actions/checkout@v4
        with:
          repository: G1234-cod/Individual-Resume
          path: temp-resume
      
      - name: 3.2 Assemble Resume and Projects
        run: |
          # 1. 同步简历 HTML 及资源 (正确排除 my-resume 和 build-journal)
          mkdir -p docs/public/resume
          rsync -av --exclude='.git' --exclude='my-resume' --exclude='build-journal' temp-resume/ docs/public/resume/
          
          # 2. 映射 resume-project 专栏 (源目录纠正为 my-resume，强力清除旧软链)
          rm -rf docs/resume-project
          mkdir -p docs/resume-project
          if [ -d "temp-resume/my-resume" ] && [ "$(ls -A temp-resume/my-resume)" ]; then cp -r temp-resume/my-resume/* docs/resume-project/ || true; fi

          # 3. 映射建站日志 (强力清除旧软链)
          rm -rf docs/build-journal
          mkdir -p docs/build-journal
          if [ -d "temp-resume/build-journal" ] && [ "$(ls -A temp-resume/build-journal)" ]; then cp -r temp-resume/build-journal/* docs/build-journal/ || true; fi
          
          # 4. 销毁临时仓库
          rm -rf temp-resume

      # ==========================================
      # 阶段四：Node.js 环境搭建与全量编译
      # ==========================================
      - name: 4. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 5. Install Dependencies
        run: npm install

      - name: 6. Execute VitePress Build
        run: npm run docs:build

      # 阶段五：清理旧产物并加密传输至阿里云 (CD 持续部署)
      # ==========================================
      - name: 7.1 Clear Old Files on Server (Clean Garbage)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          passphrase: ${{ secrets.SERVER_PASSPHRASE }}
          script: |
            # 确保目标目录存在，然后清空其内部所有旧的哈希文件，保留目录本身
            mkdir -p /var/www/html
            rm -rf /var/www/html/*
            echo "✅ Server garbage cleared successfully."

      - name: 7.2 Deploy to Aliyun Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_KEY }}
          passphrase: ${{ secrets.SERVER_PASSPHRASE }}
          source: "docs/.vitepress/dist/*"
          target: "/var/www/html/"
          strip_components: 3
